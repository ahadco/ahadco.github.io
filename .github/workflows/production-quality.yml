name: AHAD Production Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/ahad-100]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax
        run: npm run check

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high
